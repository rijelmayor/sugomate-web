name: SUGOMATE Mobile Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-validation.yml"
  push:
    branches:
      - main
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Expo and TypeScript checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"

      - name: Show runtime versions
        run: |
          node --version
          npm --version

      - name: Install mobile dependencies
        run: npm install --no-audit --no-fund

      - name: Check Expo dependency compatibility
        run: npx expo install --check

      - name: Run Expo Doctor
        run: npx expo-doctor

      - name: Run TypeScript validation
        run: npm run typecheck
